  <!-- Icon (translated to center top half) -->
  <g transform="translate(24,12)">
    <rect x="13" y="14" width="26" height="24" rx="4" fill="#1e293b" /><text x="26" y="31" font-family="Arial" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">KPS</text>
  </g>

  <!-- Sector tag -->
  <text x="50" y="72" font-family="Inter,system-ui,sans-serif" font-size="6" font-weight="800" fill="#ea580c" letter-spacing="0.8px" text-anchor="middle">FABRICATION</text>

  <!-- Company name -->
  <text x="50" y="85" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="800" fill="#1e293b" letter-spacing="1px" text-anchor="middle">KPS</text>
